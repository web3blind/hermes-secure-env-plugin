name: secure-env-ingress
version: 0.7.10
description: "Secure ENV: Telegram HTTPS forms for login/password, TOTP keys, payment card storage/protected iframe fill, verification codes/passcodes, .env secrets and trusted operations."
author: web3blind
python_dependencies:
  - "cryptography>=50.0.0,<51"
  - "python-dotenv>=1.2.2,<2"
  - "python-telegram-bot>=22.6,<23"
provides_tools:
  - browser_vault
  - secure_payment_fill
  - secure_operation
provides_hooks:
  - pre_gateway_dispatch
